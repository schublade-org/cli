id = "a11y-clean"
title = "Accessibility/No errors"
description = "A comparable fixture in which images, controls, links, and fields all have accessible names."
template = """
<div style="display:grid;gap:16px;width:min(440px,100%)">
  <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 48'%3E%3Crect width='96' height='48' rx='8' fill='%23dcfce7'/%3E%3C/svg%3E" width="96" height="48" alt="Abstract green sample">
  <div style="display:flex;gap:10px"><button type="button">Save changes</button><button type="button" aria-label="Close preview"><span aria-hidden="true">×</span></button></div>
  <a href="#documentation">Read the documentation</a>
  <label for="clean-name">Name</label>
  <input id="clean-name" type="text">
  <label for="clean-choice">Choice</label>
  <select id="clean-choice"><option>First option</option></select>
  <label for="clean-notes">Notes</label>
  <textarea id="clean-notes"></textarea>
</div>
"""
