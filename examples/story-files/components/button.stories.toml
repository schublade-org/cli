# CSF-style story: meta + args + argTypes, plus named variants.
# `component` includes the actual template that lives with the source.

title = "Components/Button"
description = "The primary action control. Keep the label short and specific."
component = "./button.html"
code = """<Button variant="{{variant}}" size="{{size}}" disabled={{{disabled}}}>{{label}}</Button>"""

[args]
label = "Save changes"
variant = "primary"
size = "md"
disabled = false

[argTypes.label]
control = "text"
name = "Label"

[argTypes.variant]
control = "select"
name = "Variant"
options = [
  { value = "primary", label = "Primary" },
  { value = "secondary", label = "Secondary" },
  { value = "ghost", label = "Ghost" },
]

[argTypes.size]
control = "select"
name = "Size"
options = [
  { value = "sm", label = "Small" },
  { value = "md", label = "Medium" },
  { value = "lg", label = "Large" },
]

[argTypes.disabled]
control = "boolean"
name = "Disabled"

[[stories]]
name = "Default"

[[stories]]
name = "Ghost"
[stories.args]
variant = "ghost"
label = "Cancel"

[[stories]]
name = "Disabled"
[stories.args]
disabled = true
