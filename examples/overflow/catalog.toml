name = "Overflow"

[[stories]]
id = "avatar-overflow"
title = "Avatar overflow"
section = "Overflow"
description = "Twelve members, two visible slots. The stack should show one face and +11."
generator = "avatar-group"
code = """<AvatarGroup aria-label=\"{{total}} members\" max={{{visible}}} size=\"{{size}}\" />"""

[[stories.controls]]
kind = "select"
id = "size"
label = "Size"
default = "lg"

[[stories.controls.options]]
value = "sm"
label = "Small"

[[stories.controls.options]]
value = "md"
label = "Medium"

[[stories.controls.options]]
value = "lg"
label = "Large"

[[stories.controls]]
kind = "number"
id = "total"
label = "Total avatars"
min = 1
max = 12
default = 12

[[stories.controls]]
kind = "number"
id = "visible"
label = "Visible before overflow"
min = 1
max = 8
default = 2

[[stories.controls]]
kind = "boolean"
id = "showCount"
label = "Show member count"
default = true

[[stories]]
id = "long-chip"
title = "Long chip"
section = "Overflow"
description = "A filter chip whose label is longer than the chip. The label ellipsizes."
code = """<Chip>{{label}}</Chip>"""
template = """
<span class=\"chip example-long\" data-selected=\"true\">
  <span>{{label}}</span>
  <button type=\"button\" class=\"chip-x\" aria-label=\"Remove filter\">×</button>
</span>
"""

[[stories.controls]]
kind = "text"
id = "label"
label = "Label"
default = "Orders placed before 14:00 CET with express returns"

[[stories]]
id = "long-button"
title = "Long button"
section = "Overflow"
description = "A primary action whose label is a sentence, not a verb."
code = """<Button>{{label}}</Button>"""
template = """
<button class=\"btn example-long\" data-variant=\"primary\" data-size=\"md\" type=\"button\">{{label}}</button>
"""

[[stories.controls]]
kind = "text"
id = "label"
label = "Label"
default = "Save draft and notify the Aarau design review board"

[[stories]]
id = "long-accordion"
title = "Long accordion"
section = "Overflow"
description = "A summary line that wraps several times inside a fixed-width accordion."
code = """<Accordion title=\"{{title}}\" />"""
template = """
<div class=\"acc\">
  <details class=\"acc-item\" open>
    <summary class=\"acc-summary\">{{title}}</summary>
    <div class=\"acc-body\">{{body}}</div>
  </details>
</div>
"""

[[stories.controls]]
kind = "text"
id = "title"
label = "Title"
default = "What happens when a delivery window, a return label, and a customs hold all land on the same afternoon?"

[[stories.controls]]
kind = "text"
id = "body"
label = "Body"
default = "The workshop canvas stays isolated. Long copy should wrap inside the accordion, not blow out the iframe."
