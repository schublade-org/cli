name = "Many controls"

[[stories]]
id = "filter-bar"
title = "Filter bar"
section = "Controls"
description = "A dense settings surface. Every control kind, enough rows to scroll the right rail."
code = """<FilterBar
  query=\"{{query}}\"
  status=\"{{status}}\"
  sort=\"{{sort}}\"
  tone=\"{{tone}}\"
  size=\"{{size}}\"
  pageSize={{{pageSize}}}
  maxResults={{{maxResults}}}
  density={{{density}}}
  includeArchived={{{includeArchived}}}
  unreadOnly={{{unreadOnly}}}
  showCount={{{showCount}}}
  assignedTo=\"{{assignee}}\"
/>"""
template = """
<div class=\"example-stack\">
  <div class=\"example-row\">
    <button class=\"btn\" data-variant=\"{{tone}}\" data-size=\"{{size}}\" type=\"button\">{{query}}</button>
    <span class=\"badge\" data-tone=\"neutral\">{{status}}</span>
    <span class=\"chip\" data-selected=\"{{unreadOnly}}\"><span>{{assignee}}</span></span>
  </div>
  <p class=\"ag-caption\">{{sort}} · {{pageSize}} / page · density {{density}}</p>
</div>
"""

[[stories.controls]]
