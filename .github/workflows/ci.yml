name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
      - run: cargo test --locked

  npm:
    name: npm wrapper tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run test:npm
      - name: Sync script dry-run (token missing)
        run: |
          set +e
          output="$(bash .github/scripts/sync-examples.sh 2>&1)"
          status=$?
          set -e
          echo "$output"
          [ "$status" -ne 0 ]
          echo "$output" | grep -q "EXAMPLES_SYNC_TOKEN"
      - name: Sync script dry-run (lists examples)
        env:
          EXAMPLES_SYNC_TOKEN: dummy
          EXAMPLES_SYNC_DRY_RUN: "1"
        run: |
          output="$(bash .github/scripts/sync-examples.sh)"
          echo "$output"
          echo "$output" | grep -q "story-files"
          echo "$output" | grep -q "empty-catalog"
