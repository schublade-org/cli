name: Release CLI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to build (e.g. v0.1.0). Defaults to the package.json version."
        required: false

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ -f "target/${{ matrix.target }}/release/schublade.exe" ]; then
            bin="target/${{ matrix.target }}/release/schublade.exe"
          else
            bin="target/${{ matrix.target }}/release/schublade"
          fi
          mkdir -p dist
          archive="schublade-v${version}-${{ matrix.target }}.tar.gz"
          tar -C "$(dirname "$bin")" -czf "dist/${archive}" "$(basename "$bin")"
          node npm/scripts/pack-platform.js \
            --target "${{ matrix.target }}" \
            --bin "$bin" \
            --out dist/npm-pkg
          echo "Built dist/${archive} and dist/npm-pkg"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist

  publish:
    name: GitHub Release + npm
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Use npm with Trusted Publishing support
        run: |
          npm install --global 'npm@^11.5.1'
          node --version
          npm --version

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="${{ github.event.inputs.tag }}"
          if [ -z "$tag" ]; then
            tag="${GITHUB_REF_NAME:-v${version}}"
          fi
          if [[ "$tag" != v* ]]; then
            tag="v${tag}"
          fi
          if [ "$tag" != "v${version}" ]; then
            echo "::error::Git tag ${tag} does not match package.json / Cargo.toml version ${version}."
            exit 1
          fi
          mkdir -p release-assets
          find artifacts -name 'schublade-v*.tar.gz' -exec cp {} release-assets/ \;
          gh release create "$tag" release-assets/*.tar.gz \
            --title "schublade ${tag}" \
            --notes "npm installs the matching @schublade/cli-<os>-<arch> optional dependency (the binary ships inside that package). Tarballs here are a convenience for non-npm installs." \
            --latest

      - name: Publish npm packages with OIDC
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(artifacts/*/npm-pkg)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "::error::No platform packages found under artifacts/*/npm-pkg"
            exit 1
          fi
          for pkg in "${packages[@]}"; do
            echo "Publishing ${pkg} ($(node -p "require('./${pkg}/package.json').name"))"
            npm publish "${pkg}" --access public
          done
          npm publish --access public
