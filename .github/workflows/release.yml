name: Release CLI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to build (e.g. v0.1.0). Defaults to the package.json version."
        required: false

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          archive="schublade-v${version}-${{ matrix.target }}.tar.gz"
          mkdir -p dist
          if [ -f "target/${{ matrix.target }}/release/schublade.exe" ]; then
            bin="target/${{ matrix.target }}/release/schublade.exe"
          else
            bin="target/${{ matrix.target }}/release/schublade"
          fi
          tar -C "$(dirname "$bin")" -czf "dist/${archive}" "$(basename "$bin")"
          echo "Built dist/${archive}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz

  publish:
    name: GitHub Release + npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="${{ github.event.inputs.tag }}"
          if [ -z "$tag" ]; then
            tag="${GITHUB_REF_NAME:-v${version}}"
          fi
          if [[ "$tag" != v* ]]; then
            tag="v${tag}"
          fi
          if [ "$tag" != "v${version}" ]; then
            echo "::error::Git tag ${tag} does not match package.json / Cargo.toml version ${version}."
            exit 1
          fi
          gh release create "$tag" dist/*.tar.gz \
            --title "schublade ${tag}" \
            --notes "Prebuilt CLI binaries for npm \`npx schublade\`. Archives are named schublade-${tag}-<rust-target>.tar.gz." \
            --latest

      - name: Publish npm package
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NPM_TOKEN}" ]; then
            echo "::notice::NPM_TOKEN is not set. GitHub Release assets are up; publish later with npm publish."
            echo "Add an npm automation token as repository secret NPM_TOKEN to publish on the next tag."
            exit 0
          fi
          npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm publish --access public
