# Schublade workshop configuration.
# Consumers point the CLI at this file; no JavaScript toolchain is required.

# Catalog next to this file is the default Aarau demo. Examples under
# examples/ ship their own schublade.toml + catalog.toml and invoke this CLI.
catalog = "./catalog.toml"

# Optional workshop chrome. Paths are relative to this file.
# logo = "./logo.svg"
# favicon = "./favicon.svg"

# Optional: walk this directory for CSF-style `*.stories.toml` files.
# Story files declare args/argTypes and include the real component template.
# They merge with catalog.toml (story files win on id collisions).
# stories = "./components"

[server]
host = "0.0.0.0"
port = 47291

# How the isolated preview applies light/dark.
# trigger: "data-attribute" | "class-name" | "local-storage"
[theme]
trigger = "data-attribute"
key = "data-theme"
light = "light"
dark = "dark"

# Native accessibility checks run inside the preview iframe.
# Comment out a rule to disable it.
[a11y]
enabled = true
rules = [
  "image-alt",
  "button-name",
  "link-name",
  "label",
  "control-name",
]
