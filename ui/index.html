<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Schublade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/workshop.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name" id="catalog-name">Schublade</span>
        </div>
        <nav class="nav" id="nav" aria-label="Stories"></nav>
      </aside>

      <div class="stage">
        <header class="stage-head">
          <div class="stage-nav">
            <button type="button" class="icon-btn" id="prev-story" aria-label="Previous story">
              <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                <path d="M12.5 4.5 7 10l5.5 5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <button type="button" class="icon-btn" id="next-story" aria-label="Next story">
              <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                <path d="M7.5 4.5 13 10l-5.5 5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
          <h1 class="story-title" id="story-title">Loading</h1>
          <div class="stage-actions">
            <button type="button" class="text-btn mobile-only" id="open-nav">Stories</button>
            <button type="button" class="text-btn mobile-only" id="open-controls">Controls</button>
          </div>
        </header>

        <div class="canvas-wrap">
          <div class="canvas-frame" id="canvas-frame">
            <iframe
              id="preview"
              title="Isolated component preview"
              sandbox="allow-scripts"
              src="/preview"
            ></iframe>
            <p class="canvas-status" id="canvas-status" hidden>Loading story…</p>
          </div>
          <div class="canvas-tools">
            <div class="viewport" role="group" aria-label="Canvas width">
              <button type="button" class="icon-btn is-active" data-viewport="desktop" aria-label="Desktop width" aria-pressed="true">
                <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                  <rect x="2.5" y="4.5" width="15" height="10" rx="1.4" stroke="currentColor" stroke-width="1.4"/>
                  <path d="M8 16.5h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                </svg>
              </button>
              <button type="button" class="icon-btn" data-viewport="tablet" aria-label="Tablet width" aria-pressed="false">
                <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                  <rect x="5" y="2.5" width="10" height="15" rx="1.6" stroke="currentColor" stroke-width="1.4"/>
                  <path d="M9 15.2h2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                </svg>
              </button>
              <button type="button" class="icon-btn" data-viewport="mobile" aria-label="Mobile width" aria-pressed="false">
                <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                  <rect x="6.2" y="2.5" width="7.6" height="15" rx="1.8" stroke="currentColor" stroke-width="1.4"/>
                  <circle cx="10" cy="15.2" r="0.7" fill="currentColor"/>
                </svg>
              </button>
            </div>
            <button type="button" class="icon-btn" id="theme-toggle" aria-label="Toggle preview theme">
              <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                <path d="M10 4.2v1.3M10 14.5v1.3M4.2 10h1.3M14.5 10h1.3M6 6l.9.9M13.1 13.1l.9.9M6 14l.9-.9M13.1 6.9l.9-.9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                <circle cx="10" cy="10" r="2.4" stroke="currentColor" stroke-width="1.4"/>
              </svg>
            </button>
            <button type="button" class="a11y-chip" id="a11y-toggle" aria-expanded="false" aria-controls="a11y-panel">
              Accessibility · …
            </button>
          </div>
          <div class="a11y-panel" id="a11y-panel" hidden>
            <p class="a11y-empty" id="a11y-empty">No issues with the current rules.</p>
            <ul class="a11y-list" id="a11y-list"></ul>
          </div>
        </div>

        <section class="code" aria-labelledby="code-title">
          <header class="code-head">
            <h2 id="code-title">Code Usage</h2>
            <button type="button" class="icon-btn" id="copy-code" aria-label="Copy usage">
              <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                <rect x="7" y="7" width="9" height="9" rx="1.4" stroke="currentColor" stroke-width="1.4"/>
                <path d="M13 7V5.6A1.6 1.6 0 0 0 11.4 4H5.6A1.6 1.6 0 0 0 4 5.6v5.8A1.6 1.6 0 0 0 5.6 13H7" stroke="currentColor" stroke-width="1.4"/>
              </svg>
            </button>
          </header>
          <pre class="code-body" id="code-body"><code></code></pre>
        </section>
      </div>

      <aside class="controls" id="controls">
        <header class="controls-head">
          <h2>Controls</h2>
          <span class="pin" aria-hidden="true"></span>
        </header>
        <p class="controls-desc" id="story-desc"></p>
        <div class="control-list" id="control-list"></div>
      </aside>
    </div>
    <div class="scrim" id="scrim" hidden></div>
    <script src="/workshop.js"></script>
  </body>
</html>
